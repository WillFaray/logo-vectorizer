<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logo Vectorizer — preview</title>
  <style>
    body { background: #f4f4f6; font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,.12); }
    h2 { margin: 0 0 12px; font-size: 16px; color: #333; }
    .checker { display: inline-block;
      background-image: conic-gradient(#e8e8e8 25%, #fff 0 50%, #e8e8e8 0 75%, #fff 0);
      background-size: 24px 24px; border-radius: 8px; overflow: auto; max-width: 100%; }
    svg { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h2>roundel (transparente)</h2>
    <div class="checker"><object data="logo_roundel_text_vector.svg" type="image/svg+xml" style="width:560px;height:560px"></object></div>
  </div>
  <div class="card">
    <h2>serif (transparente)</h2>
    <div class="checker"><object data="logo_serif_text_vector.svg" type="image/svg+xml" style="width:700px;height:350px"></object></div>
  </div>
  <div class="card">
    <h2>lowres jpeg (denoise 2, scale 2)</h2>
    <div class="checker"><object data="logo_lowres_vector.svg" type="image/svg+xml" style="width:480px;height:480px"></object></div>
  </div>
</body>
</html>
