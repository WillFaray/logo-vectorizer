[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-vectorizer"
version = "1.0.0"
description = "Vetoriza logos rasterizadas em SVG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
logo-vectorizer = "vectorizer.cli:main"

[tool.setuptools.packages.find]
include = ["vectorizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
